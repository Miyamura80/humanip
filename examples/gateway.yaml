# Example gateway config. Run with:
#   cargo run -p humanip-gateway -- --config examples/gateway.yaml
socks_listen: 127.0.0.1:1080
http_listen: 127.0.0.1:8080
connect_timeout_ms: 10000

api_keys:
  - name: alice
    key: change-me

# Each provider is a generic upstream. `{session}` in the username becomes a
# stable id for sticky sessions (fresh per connection for rotating routes);
# `{country}` becomes the route's country or "any".
providers:
  - name: netnut-isp
    exit_type: isp
    sourcing: verified
    price_per_gb: 3.4
    fraud_score: 12
    max_sticky_minutes: 129600
    latency_ms: 210
    countries: [DE, US]
    upstream:
      kind: http
      addr: gw.netnut.example:5959
      username: "customer-sess-{session}-cc-{country}"
      password: provider-password
  - name: iproxy-mobile
    exit_type: mobile
    sourcing: verified
    price_per_gb: 8.9
    fraud_score: 5
    max_sticky_minutes: 129600
    latency_ms: 690
    countries: [DE]
    upstream:
      kind: socks5
      addr: de1.iproxy.example:1080
      username: "{session}"
      password: provider-password

  # Named adapters: give only the vendor's credentials and the gateway builds
  # the host, port and username syntax for session stickiness and country
  # targeting (see crates/gateway/src/providers/). Every kind also accepts
  # `protocol: socks5 | http` and `endpoint: host:port` for regional gateways.
  # Uncomment one and fill in the selection facts for your plan.
  #
  # UNVERIFIED: these formats come from search summaries, not the vendor docs
  # (which were unreachable when written). The gateway prints a warning at
  # startup for each one. Check host, port and username syntax against your
  # dashboard before sending real traffic.
  #
  # - name: brightdata-resi
  #   exit_type: residential
  #   sourcing: verified
  #   price_per_gb: 4.0
  #   fraud_score: 15
  #   max_sticky_minutes: 30
  #   latency_ms: 400
  #   upstream: { kind: brightdata, customer: hl_abc123, zone: residential1, password: xyz }
  #
  # - name: oxylabs-resi
  #   exit_type: residential
  #   sourcing: verified
  #   price_per_gb: 4.0
  #   fraud_score: 15
  #   max_sticky_minutes: 10
  #   latency_ms: 400
  #   upstream: { kind: oxylabs, username: myuser, password: xyz }
  #
  # - name: decodo-resi
  #   exit_type: residential
  #   sourcing: verified
  #   price_per_gb: 3.5
  #   fraud_score: 15
  #   max_sticky_minutes: 10
  #   latency_ms: 400
  #   upstream: { kind: decodo, username: sp123, password: xyz, protocol: socks5 }
