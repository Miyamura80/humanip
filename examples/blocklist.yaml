# Default abuse blocklist for the humanip gateway.
#
# Why this exists: residential, ISP and mobile proxy vendors (Bright Data,
# Oxylabs, Decodo, IPRoyal, NetNut and others) forbid resellers from sending
# unverified traffic to sensitive targets in their acceptable-use policies
# (AUPs). Typical AUP lists cover government and military sites, banks and
# payment processors, crypto exchanges, healthcare portals and elections.
# Breaking an AUP can get the whole reseller account suspended, so the gateway
# enforces these rules before a request ever reaches a vendor.
#
# Review before you deploy. This is a starting point, not legal advice and not
# a copy of any one vendor's AUP. Read the AUP of every vendor you route to,
# add their extra categories, and keep this file in version control.
#
# Usage: paste the `blocked_domains:` list into your gateway config.
#
# Pattern rules (see docs/abuse.md):
#   chase.com    matches chase.com and any subdomain (x.chase.com), not notchase.com
#   .gov         matches any host ending in .gov, but not the bare "gov"
#   10.0.0.0/8   matches IP-literal targets in the block (domains never match IPs)
# Patterns must be lowercase ASCII; write internationalised names in punycode.
# When several rules match, the strictest min_kyc wins.
#
# Tiers: none < basic < verified.
#   verified: identity checked (KYC documents or business verification).
#   basic:    account tied to a verified email and payment method.
#
# Keep it maintainable: list registrable domains and public suffixes, never
# individual hosts. One pattern covers every subdomain.

blocked_domains:
  # ── Government and military: verified ───────────────────────────────
  # Leading dot for public suffixes that are not sites themselves. Where the
  # suffix is also a live site (gov.uk, bund.de) the plain form covers both.
  - { pattern: ".gov", category: government, min_kyc: verified }
  - { pattern: ".mil", category: government, min_kyc: verified }
  - { pattern: "gov.uk", category: government, min_kyc: verified }
  - { pattern: ".gouv.fr", category: government, min_kyc: verified }
  - { pattern: "bund.de", category: government, min_kyc: verified }
  - { pattern: "europa.eu", category: government, min_kyc: verified }
  - { pattern: ".gc.ca", category: government, min_kyc: verified }
  - { pattern: "canada.ca", category: government, min_kyc: verified }
  - { pattern: ".gov.au", category: government, min_kyc: verified }
  - { pattern: ".govt.nz", category: government, min_kyc: verified }
  - { pattern: ".gov.ie", category: government, min_kyc: verified }
  - { pattern: ".gv.at", category: government, min_kyc: verified }
  - { pattern: "admin.ch", category: government, min_kyc: verified }
  - { pattern: "rijksoverheid.nl", category: government, min_kyc: verified }
  - { pattern: ".gob.es", category: government, min_kyc: verified }
  - { pattern: ".gov.it", category: government, min_kyc: verified }
  - { pattern: ".gov.pl", category: government, min_kyc: verified }
  - { pattern: ".gov.br", category: government, min_kyc: verified }
  - { pattern: ".gob.mx", category: government, min_kyc: verified }
  - { pattern: ".gov.in", category: government, min_kyc: verified }
  - { pattern: ".go.jp", category: government, min_kyc: verified }
  - { pattern: ".gov.sg", category: government, min_kyc: verified }
  - { pattern: ".gov.za", category: government, min_kyc: verified }

