  - { pattern: "labcorp.com", category: healthcare, min_kyc: verified }
  - { pattern: "questdiagnostics.com", category: healthcare, min_kyc: verified }

  # ── Elections: verified ──────────────────────────────────────────────
  # Most official election sites already fall under the government suffixes
  # above (vote.gov, eac.gov, aec.gov.au). These cover the rest.
  - { pattern: ".vote", category: elections, min_kyc: verified }
