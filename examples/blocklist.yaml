  - { pattern: "gemini.com", category: crypto_exchange, min_kyc: basic }
  - { pattern: "okx.com", category: crypto_exchange, min_kyc: basic }
  - { pattern: "bybit.com", category: crypto_exchange, min_kyc: basic }
  - { pattern: "kucoin.com", category: crypto_exchange, min_kyc: basic }
  - { pattern: "crypto.com", category: crypto_exchange, min_kyc: basic }
  - { pattern: "bitfinex.com", category: crypto_exchange, min_kyc: basic }
  - { pattern: "bitget.com", category: crypto_exchange, min_kyc: basic }

  # ── Healthcare patient portals: verified ─────────────────────────────
  # Many hospital portals live on the hospital's own domain; add those for
  # your market. These are the large shared portal platforms.
  - { pattern: "mychart.com", category: healthcare, min_kyc: verified }
  - { pattern: "followmyhealth.com", category: healthcare, min_kyc: verified }
