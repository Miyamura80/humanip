  # ── Crypto exchanges: basic ──────────────────────────────────────────
  # Basic, not verified: public market-data pages and APIs are a common,
  # legitimate scraping target, and the exchanges run their own KYC before
  # any funds move. The abuse vendors worry about here (signup farming,
  # bonus abuse, credential stuffing) needs throwaway accounts, which a
  # payment-backed basic account already deters. Raise to verified if any
  # vendor you route to lists crypto alongside banking.
  - { pattern: "coinbase.com", category: crypto_exchange, min_kyc: basic }
  - { pattern: "binance.com", category: crypto_exchange, min_kyc: basic }
  - { pattern: "binance.us", category: crypto_exchange, min_kyc: basic }
  - { pattern: "kraken.com", category: crypto_exchange, min_kyc: basic }
